server: irc.libera.chat
port: 6697
tls: true
# Set true for legacy servers requiring TLS 1.2 RSA/CBC compatibility.
tls12_only: false
# Retry with that legacy suite after a failed modern handshake. Off by default:
# a network attacker can force the downgrade. Prefer tls12_only when needed.
tls_legacy_fallback: false
nick: neongrid
user: neongrid
name: NeonGrid runner daemon
channel: '#neongrid'
database: data/neongrid.db
# Optional read-only observer. Empty disables the web page.
web_listen: 127.0.0.1:8080
admin_accounts:
  - your_nickserv_account

nickserv:
  name: NickServ
  # Account to authenticate as; defaults to nick.
  account: ''
  # Prefer NEONGRID_NICKSERV_PASSWORD in the environment.
  password: ''
  # Authenticate with SASL PLAIN when the server offers it; otherwise fall back
  # to messaging identify_command to NickServ.
  sasl: true
  identify_command: IDENTIFY

progression:
  base_minutes: 30
  level_step_minutes: 2

penalty:
  speech_base_seconds: 30
  speech_per_level_seconds: 5
  speech_per_character_seconds: 1
  action_base_seconds: 45
  action_per_level_seconds: 7
  action_per_character_seconds: 1
  nick_seconds: 90
  part_seconds: 180
  quit_seconds: 240
  kick_seconds: 360

events:
  tick_seconds: 30
  encounter_minutes: 60
  city_event_minutes: 120
  pirate_minutes: 5
  district_hours: 6
  heat_decay_minutes: 30
  contract_hours: 8
  contract_participants: 4
  collision_minutes: 90
  # Uniques held by a runner offline this long return to the drop pool.
  artifact_offline_days: 7

guest_retention_days: 14
reconnect_seconds: 10
